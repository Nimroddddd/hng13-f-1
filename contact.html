<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="contact.css" />
</head>

<body>
  <div class="container">
    <h2>Contact Us</h1>
      <form onsubmit=handleSubmit(event)>
        <div>
          <label for="name-input">Full Name</label>
          <input required id="name-input" name="name" placeholder="Enter your full name" />
        </div>
        <div>
          <label for="email-input">Email</label>
          <input
            required 
            type="email" 
            id="email-input" 
            name="email" 
            placeholder="Enter your email address"
            pattern="^[a-zA-Z0-9._%+\-]+\.[a-zA-z]{2,}$"
          />
        </div>
        <div>
          <label for="subject-input">Subject</label>
          <input required id="subject-input" name="subject" placeholder="Enter the subject of the message" />
        </div>
        <div>
          <label for="message-input">Enter the message</label>
          <input required id="message-input" name="message" placeholder="Enter your full name" />
        </div>
        <button type="submit">Submit</button>
      </form>
  </div>

  <script src="contact.js"></script>
</body>

</html>
